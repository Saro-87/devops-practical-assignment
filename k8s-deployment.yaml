apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-practical-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-practical-app
  template:
    metadata:
      labels:
        app: devops-practical-app
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: app
          image: 341796273562.dkr.ecr.ap-south-1.amazonaws.com/devops-practical-app:de9499064506c73a9a99f8ce88f88ea7413fc451
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: devops-practical-service
spec:
  type: NodePort
  selector:
    app: devops-practical-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
